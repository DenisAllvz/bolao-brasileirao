<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bolão do Brasileirão</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-light vh-100 d-flex justify-content-center align-items-center">

    <div class="card bg-secondary text-light p-4 shadow-lg border-0 rounded-4" style="width: 100%; max-width: 400px;">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-warning">🏆 Bolão VIP</h2>
            <p class="text-light small">Faça login para dar seus palpites</p>
        </div>
        
        <div class="mb-3">
            <label for="login-usuario" class="form-label fw-semibold">Usuário</label>
            <input type="text" id="login-usuario" class="form-control bg-dark text-light border-0 py-2" placeholder="Digite seu usuário">
        </div>
        
        <div class="mb-4">
            <label for="login-senha" class="form-label fw-semibold">Senha</label>
            <input type="password" id="login-senha" class="form-control bg-dark text-light border-0 py-2" placeholder="Sua senha">
        </div>
        
        <button id="btn-entrar" class="btn btn-success w-100 py-2 fw-bold mb-3 shadow-sm">Entrar no Bolão</button>
        <button class="btn btn-outline-light w-100 btn-sm border-0 text-muted" data-bs-toggle="modal" data-bs-target="#modalRegras">📖 Ver Regulamento e Regras</button>
        <button class="btn btn-outline-info w-100 btn-sm border-0 text-muted" data-bs-toggle="modal" data-bs-target="#modalRegistrar">👤 Criar Nova Conta</button>
    </div>

    <!-- MODAL DE REGRAS -->
    <div class="modal fade" id="modalRegras" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-secondary text-light border-0 shadow-lg rounded-4">
                <div class="modal-header border-bottom border-dark">
                    <h5 class="modal-title text-warning fw-bold">📖 Regras do Bolão</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body py-4">
                    <ul class="list-unstyled d-flex flex-column gap-3 mb-0">
                        <li>🎯 <strong>3 Pontos:</strong> Acertar o placar exato do jogo.</li>
                        <li>⚖️ <strong>2 Pontos:</strong> Acertar a diferença de gols e o vencedor.</li>
                        <li>✅ <strong>1 Ponto:</strong> Acertar apenas quem venceu o jogo.</li>
                        <li>❌ <strong>0 Pontos:</strong> Errar completamente.</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL DE CRIAR CONTA -->
<div class="modal fade" id="modalRegistrar" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-secondary text-light border-0 shadow-lg rounded-4">
            <div class="modal-header border-bottom border-dark">
                <h5 class="modal-title text-info fw-bold">👤 Criar Nova Conta</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body py-4">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Nome de Usuário (minúsculo, sem espaço)</label>
                    <input type="text" id="reg-usuario" class="form-control bg-dark text-light border-0 py-2">
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Senha</label>
                    <input type="password" id="reg-senha" class="form-control bg-dark text-light border-0 py-2">
                </div>
                <button id="btn-registrar" class="btn btn-info w-100 py-2 fw-bold text-dark shadow-sm">Cadastrar</button>
            </div>
        </div>
    </div>
</div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Script específico da tela de login -->
    <script type="module" src="login.js"></script>
</body>
</html>
