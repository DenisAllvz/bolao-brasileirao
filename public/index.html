<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolão VIP</title>
    
    <!-- ESSA É A LINHA MÁGICA QUE PUXA O VISUAL (CSS) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. TELA DE LOGIN -->
    <div id="tela-login" class="container-login">
        <h2>🏆 Bolão VIP</h2>
        <input type="text" id="login-usuario" placeholder="Digite seu usuário">
        <input type="password" id="login-senha" placeholder="Sua senha">
        <button id="btn-entrar">Entrar no Bolão</button>
    </div>

    <!-- 2. TELA DO BOLÃO -->
    <div id="tela-bolao" class="container-bolao" style="display: none;">
        
        <!-- Navegação -->
        <div class="navegacao-datas">
            <button id="btn-anterior">◀</button>
            <h2 id="data-atual">Carregando...</h2>
            <button id="btn-proximo">▶</button>
        </div>

        <!-- Jogos -->
        <div id="lista-jogos"></div>

        <!-- Botão Salvar -->
        <div class="area-salvar">
            <button id="btn-salvar">💾 Salvar Meus Palpites</button>
        </div>

    </div>

    <!-- Conectando o motor JavaScript -->
    <script type="module" src="./main.js"></script>

</body>
</html>
